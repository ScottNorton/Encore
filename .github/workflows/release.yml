name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Encore binary
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-07
          targets: armv7-unknown-linux-musleabihf, wasm32-unknown-unknown

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-tools-zigbuild-wasm-pack-1

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install tools
        run: |
          command -v cargo-zigbuild || cargo install cargo-zigbuild
          command -v wasm-pack || cargo install wasm-pack

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            encore/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('encore/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build Encore
        run: BUILD_VERSION="${GITHUB_REF_NAME}" make encore

      - name: Upload Encore binary
        uses: actions/upload-artifact@v4
        with:
          name: encore-binary
          path: build/encore

  firmware:
    name: Build firmware image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download Encore binary
        uses: actions/download-artifact@v4
        with:
          name: encore-binary
          path: build

      - name: Make binary executable
        run: chmod 755 build/encore

      - name: Cache stock firmware image
        id: cache-stock
        uses: actions/cache@v4
        with:
          path: firmware/83_IMAGE_stock
          key: stock-firmware-83-image-b2e12178

      - name: Download stock firmware
        if: steps.cache-stock.outputs.cache-hit != 'true'
        run: bash scripts/build/download_firmware.sh

      - name: Verify stock firmware
        run: |
          EXPECTED_SHA="b2e12178f98a0c0904cb1e6e2ba933de0c0fef8be7c24e7852bc9933294850e8"
          ACTUAL_SHA=$(sha256sum firmware/83_IMAGE_stock | cut -d' ' -f1)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Stock firmware SHA256 mismatch!"
            echo "  Expected: $EXPECTED_SHA"
            echo "  Got:      $ACTUAL_SHA"
            exit 1
          fi
          echo "Stock firmware verified (SHA256: $ACTUAL_SHA)"

      - name: Build firmware image
        run: sudo bash scripts/build/build_firmware.sh

      - name: Verify build outputs
        run: |
          ls -lh build/firmware/83_IMAGE
          ls -lh build/firmware/rootfs.squashfs
          echo "83_IMAGE size: $(wc -c < build/firmware/83_IMAGE) bytes"
          echo "rootfs.squashfs size: $(wc -c < build/firmware/rootfs.squashfs) bytes"

      - name: Upload 83_IMAGE
        uses: actions/upload-artifact@v4
        with:
          name: 83_IMAGE
          path: build/firmware/83_IMAGE

      - name: Upload rootfs.squashfs
        uses: actions/upload-artifact@v4
        with:
          name: rootfs.squashfs
          path: build/firmware/rootfs.squashfs

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, firmware]
    steps:
      - uses: actions/checkout@v4

      - name: Download Encore binary
        uses: actions/download-artifact@v4
        with:
          name: encore-binary
          path: artifacts

      - name: Download 83_IMAGE
        uses: actions/download-artifact@v4
        with:
          name: 83_IMAGE
          path: artifacts

      - name: Download rootfs.squashfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs.squashfs
          path: artifacts

      - name: Prepare release assets
        id: assets
        run: |
          VERSION=${{ needs.build.outputs.version }}
          cd artifacts
          mv encore "encore-${VERSION}-arm"
          mv 83_IMAGE "encore-${VERSION}-83_IMAGE"
          mv rootfs.squashfs "encore-${VERSION}.squashfs"

          # Compute sizes and hashes for release notes
          for f in "encore-${VERSION}-arm" "encore-${VERSION}.squashfs" "encore-${VERSION}-83_IMAGE"; do
            sha256sum "$f" > "${f}.sha256"
          done

          ARM_SIZE=$(du -h "encore-${VERSION}-arm" | cut -f1)
          SQFS_SIZE=$(du -h "encore-${VERSION}.squashfs" | cut -f1)
          IMG_SIZE=$(du -h "encore-${VERSION}-83_IMAGE" | cut -f1)
          ARM_SHA=$(sha256sum "encore-${VERSION}-arm" | cut -d' ' -f1)
          SQFS_SHA=$(sha256sum "encore-${VERSION}.squashfs" | cut -d' ' -f1)
          IMG_SHA=$(sha256sum "encore-${VERSION}-83_IMAGE" | cut -d' ' -f1)

          {
            echo "arm_size=${ARM_SIZE}"
            echo "sqfs_size=${SQFS_SIZE}"
            echo "img_size=${IMG_SIZE}"
            echo "arm_sha=${ARM_SHA}"
            echo "sqfs_sha=${SQFS_SHA}"
            echo "img_sha=${IMG_SHA}"
          } >> "$GITHUB_OUTPUT"

          ls -lh encore-*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Firmware artifacts

            | File | Size | How to use |
            |------|------|------------|
            | `encore-${{ needs.build.outputs.version }}-arm` | ${{ steps.assets.outputs.arm_size }} | OTA binary update via web UI |
            | `encore-${{ needs.build.outputs.version }}.squashfs` | ${{ steps.assets.outputs.sqfs_size }} | OTA rootfs update via web UI |
            | `encore-${{ needs.build.outputs.version }}-83_IMAGE` | ${{ steps.assets.outputs.img_size }} | USB boot initial flash |

            ## SHA256 checksums
            ```
            ${{ steps.assets.outputs.arm_sha }}  encore-${{ needs.build.outputs.version }}-arm
            ${{ steps.assets.outputs.sqfs_sha }}  encore-${{ needs.build.outputs.version }}.squashfs
            ${{ steps.assets.outputs.img_sha }}  encore-${{ needs.build.outputs.version }}-83_IMAGE
            ```

            ## Install guide

            **First time (USB boot):** Download `83_IMAGE`, follow the [flashing guide](docs/flashing.md).

            **Update existing install:** Upload `.squashfs` (full rootfs) or `-arm` (binary only) via the web dashboard Update tab.
          files: |
            artifacts/encore-*
