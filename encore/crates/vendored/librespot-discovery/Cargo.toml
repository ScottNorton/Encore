# Vendored fork of librespot-discovery 0.8.0 (MIT, Paul Lietar / librespot-org).
#
# Why vendored: Encore advertises `_spotify-connect._tcp` via its own
# AD-bit-tolerant mDNS responder (see crates/encore-firmware/src/network/mdns.rs)
# and must be the SOLE advertiser so the group-zone logic can rename/suppress
# the service. Upstream's `Discovery::launch()` REQUIRES a compiled zeroconf
# backend (libmdns/dns-sd/avahi) or it returns Err and tears down the :48144
# HTTP server with it — so we cannot simply drop `with-libmdns`. This copy adds
# a no-op backend (`launch_noop`) that brings the HTTP server up while
# advertising nothing. Only lib.rs differs from upstream; server.rs/avahi.rs are
# verbatim. Wired in via `[patch.crates-io]` in ../../../Cargo.toml.
[package]
name = "librespot-discovery"
version = "0.8.0"
authors = ["Paul Lietar <paul@lietar.net>", "Harman Kardon Invoke Community"]
license = "MIT"
description = "The discovery logic for librespot (vendored: no-op zeroconf backend)"
repository = "https://github.com/librespot-org/librespot"
edition = "2024"
rust-version = "1.85"

[lib]
name = "librespot_discovery"
path = "src/lib.rs"

[features]
default = []

# TLS backend propagation (Encore enables rustls-tls-webpki-roots).
native-tls = ["librespot-core/native-tls"]
rustls-tls-native-roots = ["librespot-core/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["librespot-core/rustls-tls-webpki-roots"]

# Upstream zeroconf backends are intentionally NOT vendored — Encore advertises
# via its own responder and only the built-in no-op backend is used. These names
# are kept so the `#[cfg(feature = "with-*")]` gates in lib.rs resolve cleanly;
# enabling any of them will NOT compile (their deps are not vendored).
with-avahi = []
with-dns-sd = []
with-libmdns = []

[dependencies]
librespot-core = { version = "0.8.0", default-features = false }

aes = "0.8"
base64 = "0.22"
bytes = "1"
ctr = "0.9"
form_urlencoded = "1.2"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1"] }
hyper-util = { version = "0.1", features = [
    "server-auto",
    "server-graceful",
    "service",
] }
log = "0.4"
rand = { version = "0.9", default-features = false, features = ["thread_rng"] }
serde_repr = "0.1"
serde_json = "1.0"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
