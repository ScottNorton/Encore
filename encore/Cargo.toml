[workspace]
resolver = "2"
members = [
    "crates/encore-firmware",
    "crates/encore-common",
    "crates/encore-wasm",
    "crates/encore-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ScottNorton/Encore"
authors = ["Harman Kardon Invoke Community"]

[workspace.dependencies]
encore-common = { path = "crates/encore-common", default-features = false }
tokio = { version = "1", features = ["full"] }
rkyv = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-trait = "0.1"
futures = "0.3"
i2cdev = "0.6"
nix = { version = "0.29", features = ["ioctl", "fs", "mman", "term"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
# No mDNS backend feature: the vendored fork (see [patch.crates-io] below) ships
# a no-op zeroconf backend so librespot brings up the :48144 HTTP server but
# advertises nothing. Encore's own mDNS responder is the sole advertiser, which
# the group-zone logic relies on to rename/suppress the Spotify Connect service.
librespot-discovery = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false }
rumqttc = "0.24"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
libc = "0.2"
tokio-rustls = { version = "0.25", default-features = false }
rustls-pemfile = "2"
boringtun = { version = "0.7.0", default-features = false }
base64 = "0.22"
microfft = "0.6"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
time = "0.3"
# Already in the build through rcgen; used directly to read certificate dates.
x509-parser = { version = "0.18", default-features = false }

[profile.dev]
panic = "unwind"

[profile.release]
strip = true
opt-level = "z"
lto = false
codegen-units = 1
panic = "unwind"

# web-sys is enormous — needs more codegen units to avoid rustc crash on Windows
[profile.release.package.web-sys]
codegen-units = 16

# librespot-audio 0.8.0 patched with upstream PR #1722 (CDN failover). librespot
# 0.8.0 tries only the first CDN URL Spotify returns for a track; when a node
# answers with a transient non-206 (e.g. a Cloudflare 530), it bails instead of
# trying the next URL, so every track load fails with StatusCode(530). The patch
# (vendor/librespot-audio/src/fetch/mod.rs) breaks only on 206 and falls back to
# the next URL otherwise. Drop this once #1722 ships in a librespot release.
[patch.crates-io]
librespot-audio = { path = "vendor/librespot-audio" }
# Vendored fork of librespot-discovery that adds a no-op zeroconf backend: it
# brings up the :48144 HTTP server (so the device stays claimable) while
# advertising nothing, leaving Encore's own AD-bit-tolerant mDNS responder as the
# single Spotify Connect advertiser. Dropping with-libmdns alone does not work —
# Discovery::launch() returns Err without a compiled backend and tears the HTTP
# server down with it.
librespot-discovery = { path = "crates/vendored/librespot-discovery" }
