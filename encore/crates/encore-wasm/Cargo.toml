[package]
name = "encore-wasm"
description = "WASM web dashboard for the Harman Kardon Invoke smart speaker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
encore-common.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document", "Element", "Event", "EventTarget",
    "HtmlElement", "HtmlCanvasElement", "HtmlInputElement",
    "HtmlSelectElement", "HtmlButtonElement", "HtmlTextAreaElement",
    "CanvasRenderingContext2d", "TextMetrics",
    "HashChangeEvent", "InputEvent", "MouseEvent", "TouchEvent", "TouchList", "Touch", "WheelEvent",
    "KeyboardEvent",
    "Location", "Node", "Window", "Navigator",
    "WebSocket", "MessageEvent", "CloseEvent", "BinaryType",
    "CssStyleDeclaration", "DomRect", "DomTokenList",
    "Performance",
    "Headers", "Request", "RequestInit", "RequestMode", "Response",
    "DragEvent", "DataTransfer", "File", "FileList", "FileReader",
    "Blob", "BlobPropertyBag",
    "FormData",
    "Url",
    "MediaQueryList",
    "HtmlCollection", "NodeList",
    "ProgressEvent",
    "AddEventListenerOptions",
    "XmlHttpRequest", "XmlHttpRequestUpload",
    "Storage",
] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
