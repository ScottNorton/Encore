name: CI

# Note on firmware artifacts: the `firmware` job builds the combined image
# end-to-end as a CI smoke test, but intentionally does NOT upload the
# resulting 83_IMAGE or rootfs.squashfs. Those outputs contain stock
# Harman rootfs components and are not ours to redistribute. The build
# is verification only; users run `make firmware` themselves against
# their own stock image.

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC — catch dependency rot and nightly-toolchain breakage between PRs.
    - cron: '0 6 * * 1'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-07
          targets: armv7-unknown-linux-musleabihf, wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            encore/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('encore/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: make test

      - name: Lint (rustfmt + clippy)
        run: make lint

  build:
    name: Build ARM binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-07
          targets: armv7-unknown-linux-musleabihf, wasm32-unknown-unknown

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-tools-zigbuild-wasm-pack-1

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install tools
        run: |
          command -v cargo-zigbuild || cargo install cargo-zigbuild
          command -v wasm-pack || cargo install wasm-pack

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            encore/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('encore/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build Encore
        run: make encore

      - name: Show binary size
        run: ls -lh build/encore

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: encore-arm
          path: build/encore

  firmware:
    name: Build firmware image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download Encore binary
        uses: actions/download-artifact@v4
        with:
          name: encore-arm
          path: build

      - name: Make binary executable
        run: chmod 755 build/encore

      - name: Cache stock firmware image
        id: cache-stock
        uses: actions/cache@v4
        with:
          path: firmware/83_IMAGE_stock
          key: stock-firmware-83-image-b2e12178

      - name: Download stock firmware
        if: steps.cache-stock.outputs.cache-hit != 'true'
        run: bash scripts/build/download_firmware.sh

      - name: Verify stock firmware
        run: |
          EXPECTED_SHA="b2e12178f98a0c0904cb1e6e2ba933de0c0fef8be7c24e7852bc9933294850e8"
          ACTUAL_SHA=$(sha256sum firmware/83_IMAGE_stock | cut -d' ' -f1)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Stock firmware SHA256 mismatch!"
            echo "  Expected: $EXPECTED_SHA"
            echo "  Got:      $ACTUAL_SHA"
            exit 1
          fi
          echo "Stock firmware verified (SHA256: $ACTUAL_SHA)"

      - name: Build firmware image
        run: sudo bash scripts/build/build_firmware.sh

      - name: Verify build outputs (not uploaded — contains stock rootfs)
        run: |
          ls -lh build/firmware/83_IMAGE
          ls -lh build/firmware/rootfs.squashfs
          echo "83_IMAGE size: $(wc -c < build/firmware/83_IMAGE) bytes"
          echo "rootfs.squashfs size: $(wc -c < build/firmware/rootfs.squashfs) bytes"
          # Intentionally no upload-artifact step: the combined firmware
          # contains Harman's rootfs and must not be redistributed.

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for credential leaks
        run: make verify

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Informational for now: surfaces RUSTSEC advisories in the logs without
    # blocking PRs. Promote to a required check once the advisory allow-list is
    # tuned. Uses stable Rust — cargo-audit only reads Cargo.lock, it does not
    # build the project, so the pinned nightly is not needed here.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cd encore && cargo audit
