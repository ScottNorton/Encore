name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-07
          targets: armv7-unknown-linux-musleabihf, wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            encore/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('encore/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: make test

  build:
    name: Build ARM binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-07
          targets: armv7-unknown-linux-musleabihf, wasm32-unknown-unknown

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-tools-zigbuild-wasm-pack-1

      - name: Install tools
        run: |
          command -v cargo-zigbuild || cargo install cargo-zigbuild
          command -v wasm-pack || cargo install wasm-pack

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            encore/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('encore/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build Encore
        run: make encore

      - name: Show binary size
        run: ls -lh build/encore

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: encore-arm
          path: build/encore

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for credential leaks
        run: make verify
