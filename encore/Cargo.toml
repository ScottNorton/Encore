[workspace]
resolver = "2"
members = [
    "crates/encore-firmware",
    "crates/encore-common",
    "crates/encore-wasm",
    "crates/encore-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ScottNorton/hk-invoke"
authors = ["Harman Kardon Invoke Community"]

[workspace.dependencies]
encore-common = { path = "crates/encore-common", default-features = false }
tokio = { version = "1", features = ["full"] }
rkyv = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-trait = "0.1"
futures = "0.3"
i2cdev = "0.6"
nix = { version = "0.29", features = ["ioctl", "fs", "mman", "term"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-discovery = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots", "with-libmdns"] }
librespot-metadata = { version = "0.8", default-features = false }
rumqttc = "0.24"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
libc = "0.2"
tokio-rustls = { version = "0.25", default-features = false }
rustls-pemfile = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
boringtun = { version = "0.7.0", default-features = false }
base64 = "0.22"
microfft = "0.6"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
time = "0.3"

[profile.dev]
panic = "unwind"

[profile.release]
strip = true
opt-level = "z"
lto = false
codegen-units = 1
panic = "unwind"

# web-sys is enormous — needs more codegen units to avoid rustc crash on Windows
[profile.release.package.web-sys]
codegen-units = 16
